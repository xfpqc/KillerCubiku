<!-- Cubiku Variants v123 — Killer 3D Sudoku -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="Cubiku — Killer 3D Sudoku (3×3×3 Solid Sudoku Subcube)">
  <title>Cubiku — Killer 3D Sudoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=123">
</head>
<body data-theme="gold" data-mode="light">
  <div class="page-wrapper">
    <header class="app-header">
      <span class="super-title">Killer 3D Sudoku</span>
      <h1>Cubiku</h1>
    </header>

    <div class="top-action-bar">
      <div class="top-left-group">
        <button type="button" id="btn-share" class="btn-icon" title="Copy puzzle link" aria-label="Share puzzle">
          <svg id="icon-share" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
          <svg id="icon-share-check" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>

        <div id="timer-bar" class="timer-bar" role="button" tabindex="0" aria-pressed="false" title="Tap to hide timer">
          <span id="timer-display">00:00</span>
        </div>
      </div>

      <div class="center-action">
        <button type="button" id="btn-new-game" class="btn btn-primary">New Game</button>
      </div>

      <div class="controls">
        <button type="button" id="btn-restart" class="btn-icon" title="Restart Puzzle" aria-label="Restart Puzzle">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>

        <button type="button" id="btn-menu" class="btn-icon" title="Settings" aria-label="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div id="settings-panel" class="settings-panel" style="display: none;">
          <div class="setting-item">
            <span>Variant</span>
            <div class="variant-switch" role="group" aria-label="Variant Switcher">
              <a href="https://xfpqc.github.io/Cubiku/" class="variant-pill">Standard</a>
              <span class="variant-pill active" aria-current="page">Killer</span>
            </div>
          </div>

          <div class="setting-item">
            <span>Difficulty</span>
            <div class="select-wrapper">
              <select id="difficulty-select" aria-label="Difficulty">
                <option value="casual" selected>Casual</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
                <option value="fiendish">Fiendish</option>
              </select>
            </div>
          </div>

          <div class="setting-item">
            <span>Theme</span>
            <div class="select-wrapper">
              <select id="theme-select" aria-label="Theme">
                <option value="gold" selected>Amber</option>
                <option value="cyan">Teal</option>
                <option value="lavender">Violet</option>
                <option value="rose">Crimson</option>
                <option value="silver">Slate</option>
              </select>
            </div>
          </div>

          <div class="setting-divider"></div>

          <div class="setting-item">
            <span>Dark Mode</span>
            <label class="switch">
              <input type="checkbox" id="toggle-dark-mode">
              <span class="slider"></span>
            </label>
          </div>

          <div class="setting-item">
            <span>Sticky Keys</span>
            <label class="switch">
              <input type="checkbox" id="toggle-sticky-keys">
              <span class="slider"></span>
            </label>
          </div>

          <div class="setting-divider"></div>

          <div id="btn-settings-tutorial" class="setting-item action-item">
            <span>How to Play</span>
          </div>

          <div id="btn-settings-reset-stats" class="setting-item action-item" style="color: var(--error-color);">
            <span>Reset Stats</span>
          </div>
        </div>
      </div>
    </div>

    <div id="message-bar" class="message-bar hidden" role="status" aria-live="polite"></div>

    <main class="slices-container" aria-label="3D Sudoku Slices">
      <div class="slice-wrapper">
        <span class="slice-label">z = 0</span>
        <div id="grid-z0" class="grid" aria-label="Slice z=0"></div>
      </div>
      <div class="slice-wrapper">
        <span class="slice-label">z = 1</span>
        <div id="grid-z1" class="grid" aria-label="Slice z=1"></div>
      </div>
      <div class="slice-wrapper">
        <span class="slice-label">z = 2</span>
        <div id="grid-z2" class="grid" aria-label="Slice z=2"></div>
      </div>
    </main>

    <div class="keyboard-container" aria-label="Number Keypad">
      <button type="button" class="key-btn" data-val="1">1</button>
      <button type="button" class="key-btn" data-val="2">2</button>
      <button type="button" class="key-btn" data-val="3">3</button>
      <button type="button" class="key-btn" data-val="4">4</button>
      <button type="button" class="key-btn" data-val="5">5</button>
      <button type="button" id="btn-pencil" class="key-btn" data-val="pencil" title="Toggle Pencil Mode" aria-label="Pencil Mode">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
        </svg>
      </button>

      <button type="button" class="key-btn" data-val="6">6</button>
      <button type="button" class="key-btn" data-val="7">7</button>
      <button type="button" class="key-btn" data-val="8">8</button>
      <button type="button" class="key-btn" data-val="9">9</button>
      <button type="button" id="btn-erase" class="key-btn" data-val="erase" title="Erase" aria-label="Erase">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M20 20H7L3 16c-.6-.6-.6-1.5 0-2.1l10-10c.6-.6 1.5-.6 2.1 0l6 6c.6.6.6 1.5 0 2.1L13 20"></path>
          <path d="M6 11l7 7"></path>
        </svg>
      </button>
      <button type="button" id="btn-undo" class="key-btn" data-val="undo" title="Undo" aria-label="Undo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
      </button>
    </div>

    <div class="stats-container" aria-label="Statistics">
      <div class="stat-box">
        <span class="stat-label">Wins</span>
        <span id="stat-wins" class="stat-value">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Best Time</span>
        <span id="stat-best" class="stat-value">--:--</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Average</span>
        <span id="stat-avg" class="stat-value">--:--</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Last Time</span>
        <span id="stat-last" class="stat-value">--:--</span>
      </div>
    </div>

    <footer>3×3×3 Solid Sudoku Subcube • Killer Variant</footer>
  </div>

  <!-- Interactive Tutorial Overlay -->
  <div id="tutorial-overlay" class="tutorial-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="tutorial-title">
    <div class="tutorial-box">
      <div class="tutorial-header">
        <h2 id="tutorial-title">Welcome to 3D</h2>
        <button type="button" id="btn-close-tutorial" class="btn-icon" aria-label="Close Tutorial">&times;</button>
      </div>
      <div id="tutorial-text" class="tutorial-content"></div>
      <div class="tutorial-actions">
        <button type="button" id="btn-tut-prev" class="btn btn-secondary">Back</button>
        <button type="button" id="btn-tut-next" class="btn btn-primary">Next</button>
      </div>
    </div>
  </div>

  <script src="game.js?v=123"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=123').catch(() => {});
      });
    }
  </script>
</body>
</html>
